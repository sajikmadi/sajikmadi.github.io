# 홈페이지 배포: 파일을 올릴 때 + 매일 아침 6시(한국시간)에 유튜브·블로그 새 글을 가져와 다시 올린다
name: 홈페이지 배포

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: 유튜브·블로그 새 글 가져오기
        working-directory: 작업파일
        run: python update_feed.py
      - name: 홈페이지 파일 만들기
        working-directory: 작업파일
        run: python build.py
      - name: 바뀐 목록 저장
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add 작업파일/feed.json 올릴파일
          git diff --cached --quiet || git commit -m "유튜브·블로그 목록 자동 갱신" && git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 올릴파일

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
